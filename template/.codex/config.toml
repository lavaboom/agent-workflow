#:schema https://developers.openai.com/codex/config-schema.json
# agent-workflow v2: project-local Codex roles. Managed file; edit upstream (docs/harness/maintenance.md).
# Each role file sets a default model and effort; every spawn overrides them with the row the ladder gives
# (docs/harness/model-policy.md). The provider is inherited from the user's config; Codex reads AGENTS.md
# on its own. MCP servers are added per project below, sparingly (docs/harness/tooling.md).

[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 3

[agents.builder]
description = "Builds one plan task or small task in its worktree, runs the tier's checks, commits with status.md updated, reports evidence. Never merges or pushes."
config_file = "agents/builder.toml"

[agents.reviewer]
description = "Re-runs a task's acceptance checks and reviews its diff against the spec; returns APPROVE or FIX with findings as severity, file:line, what, why, fix. Read-only."
config_file = "agents/reviewer.toml"

[agents.explorer]
description = "Read-only codebase investigation: traces the real path, cites file:line, returns a short conclusion."
config_file = "agents/explorer.toml"
